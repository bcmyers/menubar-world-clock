[package]
name = "world-clock"
version = "0.1.0"
edition = "2024"
description = "A native macOS menu bar world clock"
license = "MIT OR Apache-2.0"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
chrono-tz = "0.10.4"
dirs = "6.0.0"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSFont",
    "NSFontDescriptor",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSRunningApplication",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSText",
    "NSTextField",
    "NSView",
    "NSWorkspace",
    "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSDate",
    "NSGeometry",
    "NSNotification",
    "NSObjCRuntime",
    "NSObject",
    "NSRunLoop",
    "NSString",
    "NSTimer",
    "NSURL",
] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"

[profile.release]
lto = "thin"
strip = true
